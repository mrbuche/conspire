name: Test
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.head_ref }}
env:
  CARGO_TERM_COLOR: always
on:
  pull_request:
    branches: main
permissions: {}
jobs:
  Checks:
    strategy:
      fail-fast: true
      matrix:
        features:
          - io
          - math
          - geometry
          - mechanics
          - physics
          - constitutive
          - elements
          - cbm
          - fem
          - vem
          - all
          - gpu
          - gpu,fem
        os: [macos-latest, ubuntu-latest, windows-latest]
        toolchain: [stable, beta]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: clippy, rustfmt
          toolchain: ${{ matrix.toolchain }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --features ${{ matrix.features }} -- -D warnings
      - name: Clippy tests
        run: cargo clippy --features ${{ matrix.features }} --tests -- -D warnings
      - name: Test
        run: cargo test --release --features ${{ matrix.features }}
      - name: Tree
        shell: bash
        run: $([[ $(cargo tree --edges normal --features ${{ matrix.features }} | wc -l) -eq 1 ]])
  Coverage:
    strategy:
      fail-fast: true
      matrix:
        features:
          - io
          - math
          - geometry
          - mechanics
          - physics
          - constitutive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Install
        run: cargo install cargo-llvm-cov
      - name: Coverage
        if:  matrix.features == 'io'
        run: cargo llvm-cov test --profile release --features ${{ matrix.features }} --fail-under-functions 100 --fail-under-lines 100 --fail-under-regions 99
      - name: Coverage
        if:  matrix.features != 'io'
        run: cargo llvm-cov test --profile release --features ${{ matrix.features }} --fail-under-functions 50 --fail-under-lines 50 --fail-under-regions 50
  Nightly:
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: clippy
          toolchain: nightly
      - name: Test
        run: cargo test --release --features all,nightly
  Device:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          components: clippy, llvm-bitcode-linker
          targets: nvptx64-nvidia-cuda
          toolchain: nightly
      - name: Clippy without std
        run: |
          for features in math mechanics constitutive elements; do
            cargo clippy --no-default-features --features $features -- -D warnings
            cargo clippy --no-default-features --features $features --tests -- -D warnings
          done
      - name: Clippy for a device
        run: cargo clippy --no-default-features --features elements --target nvptx64-nvidia-cuda -- -D warnings
      - name: Kernels
        run: sh kernels/build.sh
      - name: Clippy kernels
        run: cargo clippy --release --example kernels_elements --target nvptx64-nvidia-cuda --no-default-features --features kernels -- -D warnings
      - name: Test kernels
        run: cargo test --features elements,gpu --lib gpu::kernels
  Autodiff:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zautodiff=Enable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
      - name: Enzyme
        run: rustup component add enzyme
      - name: Build
        run: cargo build --release --features all
