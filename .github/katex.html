<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" integrity="sha384-WwGtaC6ywCHxA5cstpj/3+xIZvTez8dq2IcBQaXRkenHZ7FVVq1ZROtURwfbtTlG" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js" integrity="sha384-a1WQdjRj162i159OYq041X6I4K8NenkrI09LlPmiHg0YOb7CR+wJOraXwK9abpnE" crossorigin="anonymous"></script>
<script>
  "use strict";
  document.addEventListener("DOMContentLoaded", function () {
      var maths = document.getElementsByClassName("language-math");
      for (var i=0; i<maths.length; i++) {
          var el = maths[i];
          katex.render(el.innerText, el, {displayMode: true});
      }

      // Snapshot the list, since rendering can change the live collection.
      var codes = Array.prototype.slice.call(document.getElementsByTagName("code"));
      codes.forEach(function (el) {
          if (el.classList.contains("language-math")) return;
          if (el.classList.contains("language-inline-math")) {
              katex.render(el.textContent, el);
              return;
          }

          if (el.parentNode.nodeName.toLowerCase() === "pre") return;

          // Inline math is written as $<code>...</code>$: the dollar signs
          // are the adjacent text nodes, so strip them and render in place.
          var before = el.previousSibling;
          var after = el.nextSibling;
          if (isText(before) && isText(after) &&
              before.nodeValue.slice(-1) === "$" &&
              after.nodeValue.charAt(0) === "$") {
              before.nodeValue = before.nodeValue.slice(0, -1);
              after.nodeValue = after.nodeValue.slice(1);
              katex.render(el.textContent, el);
          }
      });
  });

  function isText(node) {
      return node !== null && node.nodeType === Node.TEXT_NODE;
  }
</script>
