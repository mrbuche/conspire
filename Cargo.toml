[package]
authors = ["Michael R. Buche <mrbuche@sandia.gov>", "Chad B. Hovey <chovey@sandia.gov>"]
categories = ["mathematics", "science"]
description = "c o n s p i r e"
documentation = "https://docs.rs/crate/conspire"
edition = "2024"
exclude = ["/book/", "/book.toml"]
homepage = "https://mrbuche.github.io/conspire"
keywords = ["conspire", "mrbuche"]
license = "GPL-3.0"
name = "conspire"
repository = "https://github.com/mrbuche/conspire"
version = "0.9.1"

[features]
all = ['cbm', 'vem']
autodiff = []
cbm = ['constitutive', 'geometry']
constitutive = ['mechanics']
default = ['std']
doc = []
elements = ['constitutive']
fem = ['elements', 'geometry']
geometry = ['io', 'math']
gpu = ['elements', 'std']
io = ['std']
kernels = ['elements']
math = []
mechanics = ['math']
nightly = []
physics = ['mechanics', 'std']
std = []
vem = ['fem']

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = ["--html-in-header", ".github/katex.html"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[[example]]
name = "book"
required-features = ["constitutive", "doc"]

[[example]]
crate-type = ["cdylib"]
name = "fit_kernels"
path = "kernels/fit.rs"
required-features = ["kernels"]

[[example]]
crate-type = ["cdylib"]
name = "kernels"
path = "kernels/lib.rs"
required-features = ["kernels"]
